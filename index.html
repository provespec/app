<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Parity — ProveSpec</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Open any specification in the ProveSpec catalog and read it as a graded capability tree."
    />
    <!--
      Looser than the Electron renderer's policy by exactly one directive: the browser shell
      fetches the catalog over the network, which the desktop app never does.

      localhost is allowed so the shell can be pointed at a locally built catalog
      (`pnpm site:preview` + VITE_PROVESPEC_SITE) and an unpublished change can be looked at
      before it is public. It grants nothing to a remote page — a site cannot reach the
      visitor's localhost through this.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://provespec.com http://localhost:* http://127.0.0.1:*; img-src 'self' data:"
    />
    <script type="module" crossorigin src="/assets/index-CCczXVh3.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cm7s8j6e.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
